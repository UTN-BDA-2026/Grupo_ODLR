<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>pdf_extractext — Registro</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/dist/tabler-icons.min.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600&family=Inter:wght@400;500&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg-base:        #0F0F13;
      --bg-surface:     #18181F;
      --bg-elevated:    #22222C;
      --border:         #2E2E3A;
      --text-primary:   #F0EDE6;
      --text-secondary: #9B97A8;
      --text-muted:     #5C5870;
      --accent:         #6B5EFF;
      --accent-hover:   #5A4EE0;
      --success-bg:     #0D2B1F;
      --success-text:   #4ADE80;
      --error-bg:       #2B0D0D;
      --error-text:     #F87171;
    }

    body {
      min-height: 100vh;
      background: var(--bg-base);
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Inter', sans-serif;
      color: var(--text-primary);
    }

    .app-shell {
      display: flex;
      width: 680px;
      border-radius: 16px;
      overflow: hidden;
      border: 1px solid var(--border);
      box-shadow: 0 24px 60px rgba(0,0,0,0.5);
    }

    /* ── Sidebar ── */
    .sidebar {
      width: 220px;
      background: var(--accent);
      padding: 2rem 1.5rem;
      display: flex;
      flex-direction: column;
      justify-content: center;
      flex-shrink: 0;
    }

    .sidebar-brand {
      display: flex;
      align-items: center;
      justify-content: center;
      flex: 1;
      width: 100%;
    }

    .pdf-icon {
      width: 140px;
      height: auto;
    }

    .sidebar-brand-name {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 48px;
      font-weight: 700;
      color: rgba(255,255,255,0.9);
      text-align: center;
      letter-spacing: 0.08em;
      writing-mode: vertical-rl;
      text-orientation: mixed;
      transform: rotate(180deg);
    }

    /* ── Main ── */
    .main {
      flex: 1;
      background: var(--bg-surface);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem;
    }

    .register-card {
      background: var(--bg-elevated);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 2rem 2rem 1.25rem;
      width: 100%;
      max-width: 320px;
    }

    .card-title {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 20px;
      font-weight: 500;
      margin-bottom: 4px;
    }

    .card-subtitle {
      font-size: 13px;
      color: var(--text-secondary);
      margin-bottom: 1.5rem;
    }

    .field { margin-bottom: 1rem; }

    label {
      display: block;
      font-size: 12px;
      font-weight: 500;
      color: var(--text-secondary);
      margin-bottom: 5px;
    }

    .label-optional {
      font-size: 10px;
      font-weight: 400;
      color: var(--text-muted);
      margin-left: 3px;
    }

    input[type=text], input[type=password], input[type=email] {
      width: 100%;
      height: 38px;
      padding: 0 12px;
      font-size: 14px;
      font-family: 'Inter', sans-serif;
      background: var(--bg-surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text-primary);
      outline: none;
      transition: border-color 0.15s, box-shadow 0.15s;
    }

    input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(107,94,255,0.18);
    }

    input.input-error {
      border-color: var(--error-text);
    }

    .btn-primary {
      width: 100%;
      height: 40px;
      background: var(--accent);
      color: #fff;
      border: none;
      border-radius: 8px;
      font-family: 'Space Grotesk', sans-serif;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: background 0.15s, transform 0.1s;
    }

    .btn-primary:hover { background: var(--accent-hover); }
    .btn-primary:active { transform: scale(0.98); }
    .btn-primary:disabled { opacity: 0.5; cursor: not-allowed; }

    /* Progress bar */
    .progress-wrap {
      height: 2px;
      background: var(--border);
      border-radius: 2px;
      overflow: hidden;
      margin-top: 0.75rem;
      display: none;
    }
    .progress-wrap.visible { display: block; }
    .progress-fill {
      height: 100%;
      width: 0%;
      background: var(--accent);
      transition: width 0.1s linear;
    }

    /* Alerts */
    .alert {
      font-size: 12px;
      border-radius: 8px;
      padding: 8px 12px;
      margin-top: 0.75rem;
      display: none;
      align-items: center;
      gap: 6px;
    }
    .alert.visible { display: flex; }
    .alert-error   { background: var(--error-bg);   color: var(--error-text); }
    .alert-success { background: var(--success-bg); color: var(--success-text); }

    /* Footer login link */
    .card-footer {
      margin-top: 1.25rem;
      padding-top: 1rem;
      border-top: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
    }

    .footer-text {
      font-size: 12px;
      color: var(--text-muted);
    }

    .footer-link {
      font-size: 12px;
      color: var(--accent);
      text-decoration: none;
      font-weight: 500;
    }

    .footer-link:hover { text-decoration: underline; }

  </style>
</head>
<body>

<div class="app-shell">
  <!-- Sidebar -->
  <aside class="sidebar">
    <div class="sidebar-brand">
      <svg class="pdf-icon" viewBox="0 0 90 135" xmlns="http://www.w3.org/2000/svg">
        <!-- Documento -->
        <path fill="white" d="M10 0 H58 L78 20 V100 Q78 110 68 110 H20 Q10 110 10 100 Z"/>
        <path fill="rgba(107,94,255,0.45)" d="M58 0 L58 20 L78 20 Z"/>
        <!-- Etiqueta PDF -->
        <rect fill="#6B5EFF" x="4" y="40" width="52" height="26" rx="4"/>
        <text x="30" y="58" font-family="Space Grotesk, Arial, sans-serif" font-weight="700" font-size="17" fill="white" text-anchor="middle">PDF</text>
        <!-- Flecha: tallo -->
        <rect fill="white" x="37" y="100" width="16" height="22" rx="2"/>
        <!-- Flecha: cabeza -->
        <polygon fill="white" points="22,116 45,135 68,116"/>
      </svg>
    </div>
  </aside>

  <!-- Main -->
  <main class="main">
    <div class="register-card">
      <h1 class="card-title">Crear cuenta</h1>
      <p class="card-subtitle">Completá los datos para registrarte</p>

      <div class="field">
        <label for="full-name">
          Nombre completo
          <span class="label-optional">(opcional)</span>
        </label>
        <input type="text" id="full-name" placeholder="Juan Pérez" autocomplete="name" />
      </div>

      <div class="field">
        <label for="email">Email</label>
        <input type="email" id="email" placeholder="juan@ejemplo.com" autocomplete="email" />
      </div>

      <div class="field">
        <label for="username">Usuario</label>
        <input type="text" id="username" placeholder="juanperez" autocomplete="username" />
      </div>

      <div class="field">
        <label for="password">Contraseña</label>
        <input type="password" id="password" placeholder="••••••••" autocomplete="new-password" />
      </div>

      <div class="field">
        <label for="password-confirm">Confirmar contraseña</label>
        <input type="password" id="password-confirm" placeholder="••••••••" autocomplete="new-password" />
      </div>

      <button class="btn-primary" id="btn-register">
        <i class="ti ti-user-plus"></i> Crear cuenta
      </button>

      <div class="progress-wrap" id="progress-wrap">
        <div class="progress-fill" id="progress-fill"></div>
      </div>

      <div class="alert alert-error" id="error-msg">
        <i class="ti ti-alert-circle"></i>
        <span id="error-text">Error al registrarse.</span>
      </div>

      <div class="alert alert-success" id="success-msg">
        <i class="ti ti-check"></i>
        <span>Cuenta creada. Redirigiendo al login...</span>
      </div>

      <div class="card-footer">
        <span class="footer-text">¿Ya tenés cuenta?</span>
        <a href="index.html" class="footer-link">Iniciar sesión</a>
      </div>

    </div>
  </main>
</div>

<script>
  const API_URL = () => window.location.origin;

  function animateProgress() {
    const wrap = document.getElementById('progress-wrap');
    const fill = document.getElementById('progress-fill');
    wrap.classList.add('visible');
    fill.style.width = '0%';
    let pct = 0;
    const iv = setInterval(() => {
      pct += Math.random() * 12 + 4;
      if (pct >= 90) { pct = 90; clearInterval(iv); }
      fill.style.width = pct + '%';
    }, 120);
    return { fill, wrap };
  }

  function finishProgress({ fill, wrap }) {
    fill.style.width = '100%';
    setTimeout(() => { wrap.classList.remove('visible'); fill.style.width = '0%'; }, 400);
  }

  async function doRegister() {
    const fullName  = document.getElementById('full-name').value.trim();
    const email     = document.getElementById('email').value.trim();
    const username  = document.getElementById('username').value.trim();
    const password  = document.getElementById('password').value;
    const passConf  = document.getElementById('password-confirm').value;
    const btn       = document.getElementById('btn-register');
    const errEl     = document.getElementById('error-msg');
    const errText   = document.getElementById('error-text');
    const successEl = document.getElementById('success-msg');

    errEl.classList.remove('visible');
    successEl.classList.remove('visible');
    document.querySelectorAll('input').forEach(i => i.classList.remove('input-error'));

    if (!email || !username || !password || !passConf) {
      errText.textContent = 'Completá los campos obligatorios.';
      errEl.classList.add('visible');
      return;
    }

    if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
      errText.textContent = 'Ingresá un email válido.';
      errEl.classList.add('visible');
      document.getElementById('email').classList.add('input-error');
      return;
    }

    if (password.length < 8) {
      errText.textContent = 'La contraseña debe tener al menos 8 caracteres.';
      errEl.classList.add('visible');
      document.getElementById('password').classList.add('input-error');
      return;
    }

    if (password !== passConf) {
      errText.textContent = 'Las contraseñas no coinciden.';
      errEl.classList.add('visible');
      document.getElementById('password-confirm').classList.add('input-error');
      return;
    }

    btn.disabled = true;
    btn.innerHTML = '<i class="ti ti-loader-2"></i> Registrando...';
    const prog = animateProgress();

    const body = { email, username, password };
    if (fullName) body.full_name = fullName;

    try {
      const res = await fetch(`${API_URL()}/api/v1/users/`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(body)
      });

      finishProgress(prog);

      if (!res.ok) {
        const data = await res.json().catch(() => ({}));
        errText.textContent = data.detail || 'No se pudo crear la cuenta.';
        errEl.classList.add('visible');
        btn.disabled = false;
        btn.innerHTML = '<i class="ti ti-user-plus"></i> Crear cuenta';
      } else {
        successEl.classList.add('visible');
        btn.innerHTML = '<i class="ti ti-check"></i> Cuenta creada';
        setTimeout(() => { window.location.href = 'index.html'; }, 1500);
      }
    } catch (e) {
      finishProgress(prog);
      errText.textContent = 'No se pudo conectar con la API. ¿Está corriendo?';
      errEl.classList.add('visible');
      btn.disabled = false;
      btn.innerHTML = '<i class="ti ti-user-plus"></i> Crear cuenta';
    }
  }

  document.getElementById('btn-register').addEventListener('click', doRegister);
  document.addEventListener('keydown', e => { if (e.key === 'Enter') doRegister(); });

  if (localStorage.getItem('jwt_token')) {
    window.location.href = 'dashboard.html';
  }
</script>

</body>
</html>
